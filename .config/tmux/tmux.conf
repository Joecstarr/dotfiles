
set  -g default-terminal "kitty"
set  -g base-index      0
setw -g pane-base-index 0
# We need to set default-shell before calling new-session
set  -g default-shell "/nix/store/51yi7b64mxyspaa012c5gwpmg92rs5c5-zsh-5.9.2/bin/zsh"





set -g status-keys vi
set -g mode-keys   vi



# rebind main key: C-g
unbind C-b
set -g prefix C-g
bind -N "Send the prefix key through to the application" \
  C-g send-prefix




set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     2000

# ============================================= #
# Load plugins with Home Manager                #
# --------------------------------------------- #

# tmuxplugin-resurrect
# ---------------------

run-shell /nix/store/kfp6yd5h3am3xl45ibv66jbj2i5s97qa-tmuxplugin-resurrect-unstable-2022-05-01/share/tmux-plugins/resurrect/resurrect.tmux


# tmuxplugin-sensible
# ---------------------

run-shell /nix/store/555b6mv51kxkskbd2xd0ih5rivd25n0p-tmuxplugin-sensible-unstable-2022-08-14/share/tmux-plugins/sensible/sensible.tmux


# tmuxplugin-tokyo-night-tmux
# ---------------------

run-shell /nix/store/21xd1f2hkl47yqv5v48hd8y21337q028-tmuxplugin-tokyo-night-tmux-1.8.1/share/tmux-plugins/tokyo-night-tmux/tokyo-night.tmux

# ============================================= #

source-file /nix/store/jvfb2x8sia4pj1vhkzllvkdm3lkv33z3-base16-untitled.conf

bind u attach-session -t . -c '#{pane_current_path}'
setw -g mode-keys vi
set -g focus-events on
set -gq allow-passthrough on
set -g default-terminal 'tmux-256color'
set -g visual-activity off
set -g @plugin 'Mpdreamz/tmux-cmus'