[[opener.brwsr]]
for = "linux"
orphan = true
run = 'zen "$@"'

[[opener.edit]]
for = "linux"
orphan = true
run = '$EDITOR "$@"'

[[opener.img]]
for = "linux"
orphan = true
run = 'imv "$@"'

[[opener.open]]
desc = "Open"
run = 'xdg-open "$@"'

[[opener.pdf]]
for = "linux"
orphan = true
run = 'zathura "$@"'

[[opener.play]]
for = "linux"
orphan = true
run = 'vlc "$@"'

[preview]
max_height = 1000
max_width = 1000
