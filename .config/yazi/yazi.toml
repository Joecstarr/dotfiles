[[fetchers]]
id = "git"
name = "*"
run = "git"

[[fetchers]]
id = "git"
name = "*/"
run = "git"

[[fetchers]]
id = "mime"
name = "*"
prio = "high"
run = "mime-ext"

[manager]
show_hidden = true

[[open.rules]]
mime = "application/json"
use = "edit"

[[open.rules]]
mime = "text/markdown"
use = "edit"

[[open.rules]]
mime = "text/plain"
use = "edit"

[[open.rules]]
mime = "text/x-shellscript"
